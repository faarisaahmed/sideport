[package]
name = "sideport-engine"
version = "1.0.0"
edition = "2024"
description = "Signing and install engine for Sideport, built on Impactor's libraries"
license = "MIT"

[[bin]]
name = "sideport-engine"
path = "src/main.rs"

[dependencies]
plume_core = { git = "https://github.com/claration/Impactor", rev = "b13d99559febd63e3710dfdd0ef8cdd78d10ae13" }
plume_utils = { git = "https://github.com/claration/Impactor", rev = "b13d99559febd63e3710dfdd0ef8cdd78d10ae13" }
plume_store = { git = "https://github.com/claration/Impactor", rev = "b13d99559febd63e3710dfdd0ef8cdd78d10ae13" }
idevice = { git = "https://github.com/jkcoxson/idevice", rev = "5171e34e3a236842af1160a84d955d037ddca3af", default-features = false, features = ["full", "ring"] }
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync", "fs"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
plist = "1.8"
zip = "8.6"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
sha2 = "0.11"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }

# Impactor patches apple-codesign; use its copy too.
[patch.crates-io]
apple-codesign = { git = "https://github.com/claration/Impactor", rev = "b13d99559febd63e3710dfdd0ef8cdd78d10ae13" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
